*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#193d42;color:#fff8dc;font:700 16px system-ui,sans-serif}#game{position:absolute;width:100%;height:100%;object-fit:contain;touch-action:none}#hud{position:absolute;inset:12px 14px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}#hud>div{background:#173f40e8;border:2px solid #fff1c2;border-radius:12px;padding:7px 12px;box-shadow:0 3px #17302b;white-space:nowrap}#hud button{pointer-events:auto}#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:94vh;overflow:auto;background:#173e42f5;border:3px solid #ffe9a5;border-radius:24px;padding:24px;text-align:center;box-shadow:0 12px 0 #172d31,0 18px 70px #102c35aa}h1{margin:4px 0 0;color:#ffce66;font-size:clamp(35px,7vw,64px);line-height:.88;letter-spacing:-3px;text-shadow:2px 3px #b86543}h2{margin:0 0 10px;color:#ffda85}p{font-weight:500;line-height:1.45;margin:12px 0}.eyebrow{color:#9de4c6;text-transform:uppercase;letter-spacing:3px;font-size:11px}button{background:#ffce66;border:2px solid #2c3f3e;color:#233a36;border-radius:10px;font:800 16px system-ui;padding:10px 15px;cursor:pointer;box-shadow:0 3px #a66c3c}button:hover,button:focus-visible{background:#fff0aa;outline:2px solid white}button:disabled{opacity:.68;cursor:default}button.secondary{background:#aadbc9;box-shadow:0 3px #528b82}#actions{position:absolute;bottom:12px;left:12px;right:12px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none;gap:8px}#actions button,#upgrades button{pointer-events:auto;touch-action:none}#hint{background:#173f40de;padding:9px 14px;border-radius:10px;text-align:center;font-size:13px;max-width:50%;color:#fff5d7}#upgrades{position:absolute;top:90px;right:14px;display:flex;flex-direction:column;gap:5px;width:min(218px,39vw)}#upgrades button:disabled{color:#203c39;background:#d6d9a5;border-color:#5d7260}#upgrades button{text-align:left;font-size:12px;padding:7px 9px;box-shadow:0 2px #a66c3c}#upgrades small{display:block;font-weight:500;font-size:11px}.hidden{display:none!important}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}#hud .danger{background:#ae443b;color:white}label{display:block;margin:13px;text-align:left}.stat{font-size:20px;color:#ffce66}@media(max-width:600px){#hud{inset:6px 5px auto;gap:4px}#hud>div{padding:5px 6px;font-size:11px;border-radius:7px}#hud button{font-size:11px;padding:4px}#actions{inset:auto 5px 7px}#actions button{padding:9px 10px;font-size:12px}#hint{font-size:10px;padding:5px;max-width:43%}#upgrades{top:60px;right:5px}#upgrades button{font-size:10px;padding:4px}#upgrades small{font-size:9px}#panel{padding:16px}}
</style></head><body><canvas id="game" width="1200" height="675" aria-label="Side scrolling clockwork courier game"></canvas><div id="hud" class="hidden"><div id="clock">5:00</div><div id="stats"></div><div id="progress"></div><div><button id="pause" aria-label="Pause game">Ⅱ</button></div></div><div id="upgrades" class="hidden"></div><div id="actions" class="hidden"><div><button id="left" aria-label="Steer left">◀</button> <button id="right" aria-label="Steer right">▶</button></div><div id="hint"></div><button id="action">LAUNCH</button></div><div id="panel"></div><script>
'use strict';
const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d'),H=675,G=550,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),fmt=n=>Math.floor(Math.ceil(n)/60)+':'+String(Math.ceil(n)%60).padStart(2,'0');
let W=1200;function resize(){W=Math.max(520,Math.min(1200,Math.round(H*innerWidth/innerHeight)));if(c.width!==W)c.width=W;if(s)s.cam=Math.max(0,s.x-Math.min(270,W*.28))}
const DELIVERY_TARGET=65,UPGRADE_COST=[180,400],UPGRADE_TIME=[35,105];
const choices=[['Spring','Reinforced Coil','Launch +18%','Skyhammer','Slam bounce +30%'],['Control','Tailfin','Steering +60%','Slipstream','Chains restore slam'],['Cargo','Token Magnet','Extra tokens on hits','Jackpot Parcel','Cargo hits pay double']];
let mode='title',returnMode='title',s=null,keys=new Set(),held=new Set(),last=performance.now(),acc=0,clockNow=last,settings={mute:false,reduced:false},record=0,audio=null,dirty=true;
try{const p=JSON.parse(localStorage.getItem('springjack-v1')||'{}');settings={mute:p.settings?.mute===true,reduced:p.settings?.reduced===true};record=Number.isFinite(p.record)?Math.max(0,p.record):0}catch{}
function save(){try{localStorage.setItem('springjack-v1',JSON.stringify({settings,record}))}catch{}}
function tone(f=350,d=.1,v=.045,type='triangle'){if(settings.mute||!audio||audio.state!=='running')return;const o=audio.createOscillator(),a=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(70,f*.65),t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a).connect(audio.destination);o.start();o.stop(t+d)}
function sound(){try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch{}}
function rng(){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296}
function start(seed=49217){sound();keys.clear();held.clear();s={seed,active:0,lease:120,wall:0,phase:'aim',aim:0,x:140,y:G-35,vx:0,vy:0,cam:0,score:0,coins:0,earned:0,combo:0,best:0,charge:1,branch:-1,tier:0,dist:0,stamps:0,nextGate:2200,objects:[],spawn:390,particles:[],fxSeed:8037,notice:'',noteTime:0,shake:0,slamming:false,stall:0,hitAt:-10,ended:false};mode='run';returnMode='title';acc=0;last=clockNow=performance.now();populate();refresh();tone(330)}
function populate(){while(s.spawn<s.x+2400){const r=rng(),type=r<(s.active>240?.43:.55)?'bot':r<.70?'spring':r<.85?'cargo':'cart';s.objects.push({x:s.spawn,type,phase:rng()*6.28,used:false});s.spawn+=125+rng()*(s.active>240?95:180)}s.objects=s.objects.filter(o=>o.x>s.x-600)}
function fx(){s.fxSeed=(Math.imul(s.fxSeed,1664525)+1013904223)>>>0;return s.fxSeed/4294967296}
function notice(msg){s.notice=msg;s.noteTime=1.8}
function reward(n){s.coins+=n;s.earned+=n;s.score+=n*8;dirty=true}
function burst(x,y,color,n=15){if(settings.reduced)n=Math.min(n,5);for(let i=0;i<n&&s.particles.length<180;i++){let t=fx()*6.28,v=70+fx()*210;s.particles.push({x,y,vx:Math.cos(t)*v,vy:Math.sin(t)*v,life:.3+fx()*.35,color})}}
function action(){if(mode!=='run'||!s)return;sound();if(s.phase==='aim'){let power=.42+.58*(.5+.5*Math.sin(s.aim*3.3-Math.PI/2));s.phase='fly';s.vx=(470+power*310)*(s.branch===0&&s.tier?1.18:1);s.vy=-230-power*320;s.slamming=false;notice(power>.9?'PERFECT LAUNCH!':'SPECIAL DELIVERY!');tone(480,.2);burst(s.x,s.y,'#ffe58a')}else if(s.phase==='fly'&&s.charge>=1&&s.y<G-95){s.charge=0;s.vy=Math.max(s.vy,0)+830;s.slamming=true;notice('GROUND SLAM');tone(145,.17,.08,'sawtooth')}dirty=true}
function upgrade(i){if(mode!=='run'||!s)return false;const cost=UPGRADE_COST[s.tier];if(s.tier>=2||s.active<UPGRADE_TIME[s.tier]||s.coins<cost||(s.tier===1&&s.branch!==i))return false;s.coins-=cost;s.branch=i;s.tier++;notice(choices[i][s.tier===1?1:3].toUpperCase());tone(660,.24);dirty=true;refreshUp();return true}
function hit(o){o.used=true;s.shake=settings.reduced?0:7;if(o.type==='cart'){s.vx*=.55;s.vy=-155;s.combo=0;s.slamming=false;notice('SHIELD CART!');tone(110,.16,.06,'square');burst(o.x,G-28,'#c5b6ab');return}let slam=s.slamming;s.combo=s.active-s.hitAt<4?s.combo+1:1;s.hitAt=s.active;s.best=Math.max(s.best,s.combo);s.vy=-(o.type==='spring'?560:350)-(slam?155:0);if(slam&&s.branch===0&&s.tier===2)s.vy*=1.3;s.vx=Math.min(1080,s.vx+(o.type==='spring'?125:65)+(slam?85:0));s.charge=Math.min(1,s.charge+(s.branch===1&&s.tier===2?.65:.44));let gain=o.type==='cargo'?18:10;if(s.branch===2&&s.tier)gain+=4;if(s.branch===2&&s.tier===2&&o.type==='cargo')gain*=2;reward(gain+Math.min(12,s.combo));s.score+=s.combo*25;s.slamming=false;notice((slam?'SLAM! ':o.type==='spring'?'SUPER SPRING! ':'BOUNCE! ')+'×'+s.combo);burst(o.x,G-40,o.type==='cargo'?'#ffc65c':'#99efd2');tone(260+Math.min(s.combo,9)*50,.13)}
function sim(dt){if(mode!=='run')return;s.noteTime=Math.max(0,s.noteTime-dt);s.shake=Math.max(0,s.shake-dt*30);s.particles=s.particles.filter(p=>p.life>0);for(const p of s.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt}if(s.active-s.hitAt>4)s.combo=0;if(s.phase==='aim'){s.aim+=dt;return}if(s.phase==='recover'){s.stall-=dt;if(s.stall<=0){s.phase='aim';s.aim=0;s.y=G-35;s.charge=1;notice('READY TO RELAUNCH')}return}const left=keys.has('ArrowLeft')||keys.has('KeyA')||held.has('left'),right=keys.has('ArrowRight')||keys.has('KeyD')||held.has('right');s.vx+=((right?1:0)-(left?1:0))*dt*(s.branch===1&&s.tier?280:175);s.vx=clamp(s.vx-9*dt,45,1100);let ox=s.x,oy=s.y;s.x+=s.vx*dt;s.vy+=760*dt;s.y+=s.vy*dt;populate();for(const o of s.objects){if(o.used||s.vy<0)continue;const px=o.x+Math.sin(s.active*2+o.phase)*20,top=G-(o.type==='cart'?52:48);if(oy+30<=G+4&&s.y+30>=top-10&&Math.max(ox,s.x)>=px-40&&Math.min(ox,s.x)<=px+40){s.y=top-30;hit(o);break}}if(s.y>=G-31){s.y=G-31;s.vy=-Math.max(105,Math.min(275,Math.abs(s.vy)*.43));s.vx*=s.slamming?.62:.88;s.slamming=false;s.charge=Math.min(1,s.charge+.12);s.combo=0;burst(s.x,G-6,'#efc98c',6);if(s.vx<145){s.phase='recover';s.stall=1.05;s.vx=0;s.vy=0;notice('WINDING SPRING…')}}s.dist=Math.max(s.dist,s.x-140);while(s.x>=s.nextGate){s.stamps++;s.nextGate+=2200;reward(20);notice('DISTRICT DELIVERED!');tone(780,.2);burst(s.x,s.y,'#ffdf78')}s.cam+=(Math.max(0,s.x-Math.min(270,W*.28))-s.cam)*Math.min(1,dt*8)}
function finish(){if(!s||s.ended)return;s.ended=true;s.active=Math.min(300,s.active);s.finalScore=Math.floor(s.score+s.dist/10);record=Math.max(record,s.finalScore);save();mode='results';keys.clear();held.clear();refresh();tone(520,.4)}
function advance(dt){if(!s||s.ended||!['run','pause','settings'].includes(mode)||mode==='settings'&&returnMode==='title')return;dt=Math.max(0,Math.min(dt,420-s.wall));s.wall+=dt;if(mode==='pause'||mode==='settings'){let spent=Math.min(s.lease,dt);s.lease-=spent;dt-=spent;if(s.lease<=.000001){s.lease=0;mode='run';returnMode='title';refresh()}}if(mode==='run'){const live=Math.min(dt,300-s.active);const oldActive=s.active;s.active+=live;if(UPGRADE_TIME.some(t=>oldActive<t&&s.active>=t))dirty=true;if(oldActive<240&&s.active>=240){notice('CLOSING PARADE!');tone(620,.28)}acc+=Math.min(live,.2);while(acc>=1/120){sim(1/120);acc-=1/120}if(s.active>=299.999999||s.wall>=419.999999){s.active=300;finish()}}if(s.wall>=419.999999&&!s.ended){s.active=300;finish()}}
function togglePause(){if(mode==='run'&&s.lease>0){mode='pause';keys.clear();held.clear();refresh()}else if(mode==='pause'){mode='run';refresh()}}
function title(){mode='title';s=null;keys.clear();held.clear();refresh()}
function openSettings(){returnMode=mode;mode='settings';refresh()}
const panel=$('panel');function button(label,id,cls=''){return '<button id="'+id+'" class="'+cls+'">'+label+'</button>'}function bind(id,fn){const el=$(id);if(el)el.onclick=fn}
function refresh(){const live=mode==='run';$('hud').classList.toggle('hidden',!live);$('actions').classList.toggle('hidden',!live);$('upgrades').classList.toggle('hidden',!live);panel.classList.toggle('hidden',live);if(live){dirty=true;return}if(mode==='title'){panel.innerHTML='<div class="eyebrow">Luminary Arcade • Clockwork Festival</div><h1>SPRINGJACK<br>EXPRESS</h1><p>One parcel. Five minutes. An entire city to bounce through.</p><p>Reach 65 delivery gates. Time your launch, steer into critters and slam from above. Earn tokens to specialize your courier before the final parade.</p><div class="stat">RECORD '+record.toLocaleString()+'</div><div class="row">'+button('PLAY','play')+button('SETTINGS','settings','secondary')+'</div><p>SPACE launch / slam · A/D or arrows steer · ESC pause<br>Touch controls on screen.</p>';bind('play',()=>start());bind('settings',openSettings)}else if(mode==='pause'){panel.innerHTML='<div class="eyebrow">Express service interrupted</div><h2>PAUSED</h2><p id="leaseText"></p><div class="row">'+button('RESUME','resume')+button('SETTINGS','settings','secondary')+button('RESTART RUN','restart','secondary')+button('EXIT TO TITLE','exit','secondary')+'</div>';bind('resume',togglePause);bind('settings',openSettings);bind('restart',()=>start());bind('exit',title)}else if(mode==='settings'){panel.innerHTML='<h2>SETTINGS</h2><label><input id="mute" type="checkbox" '+(settings.mute?'checked':'')+'> Mute sound effects</label><label><input id="reduced" type="checkbox" '+(settings.reduced?'checked':'')+'> Reduced motion / effects</label><p id="leaseText"></p>'+button('BACK','back');$('mute').onchange=e=>{settings.mute=e.target.checked;save()};$('reduced').onchange=e=>{settings.reduced=e.target.checked;save()};bind('back',()=>{mode=returnMode;refresh()})}else if(mode==='results'){panel.innerHTML='<div class="eyebrow">Closing bell • Run complete</div><h2>'+(s.stamps>=DELIVERY_TARGET?'PARCEL DELIVERED!':'DELIVERY WINDOW CLOSED')+'</h2><div class="stat">'+s.finalScore.toLocaleString()+' POINTS</div><p>'+Math.floor(s.dist/10)+' m · '+s.stamps+'/'+DELIVERY_TARGET+' districts · best chain ×'+s.best+'<br>Build: '+(s.tier?choices[s.branch][s.tier===1?1:3]:'Stock spring')+' · Record '+record+'</p><div class="row">'+button('RESTART RUN','restart')+button('EXIT TO TITLE','exit','secondary')+'</div>';bind('restart',()=>start());bind('exit',title)}}
function refreshUp(){if(!s||mode!=='run')return;let cost=UPGRADE_COST[s.tier];let el=$('upgrades');if(s.tier>=2){el.innerHTML='<div style="background:#173f40e8;padding:8px;border-radius:8px;color:#ffe6a4">'+choices[s.branch][3]+' equipped</div>';return}el.innerHTML=choices.map((q,i)=>s.tier&&s.branch!==i?'':'<button data-i="'+i+'" '+(s.coins<cost||s.active<UPGRADE_TIME[s.tier]?'disabled':'')+'>'+q[s.tier?3:1]+' · '+cost+' ⚙<small>'+q[s.tier?4:2]+(s.tier?' · requires '+q[1]:'')+(s.active<UPGRADE_TIME[s.tier]?' · opens at '+fmt(300-UPGRADE_TIME[s.tier]):'')+'</small></button>').join('');for(const b of el.querySelectorAll('button'))b.onclick=()=>upgrade(Number(b.dataset.i))}
function hud(){if(!s)return;if($('leaseText'))$('leaseText').textContent=returnMode==='title'&&mode==='settings'?'':fmt(Math.max(0,300-s.active))+' play left · '+Math.ceil(s.lease)+'s pause allowance'+(s.lease<15?' — resuming soon!':'');if(mode!=='run')return;$('clock').textContent=fmt(Math.max(0,300-s.active));$('clock').classList.toggle('danger',s.active>=240);$('stats').textContent='⚙ '+s.coins+'  •  '+Math.floor(s.score+s.dist/10)+' pts';$('progress').textContent='✦ '+s.stamps+'/'+DELIVERY_TARGET+'  ·  '+Math.floor(s.dist/10)+'m';$('hint').textContent=s.phase==='aim'?'Time the spring meter • '+Math.max(0,DELIVERY_TARGET-s.stamps)+' gates left':s.phase==='recover'?'Rewinding spring…':(s.active>=240?'FINAL PARADE! · '+Math.max(0,DELIVERY_TARGET-s.stamps)+' gates left · ':'')+'Slam '+Math.round(s.charge*100)+'%'+(s.combo?' · ×'+s.combo:'');$('action').textContent=s.phase==='aim'?'LAUNCH':'SLAM';$('action').disabled=s.phase==='recover'||s.phase==='fly'&&(s.charge<1||s.y>=G-95);if(dirty){refreshUp();dirty=false}}
function rr(x,y,w,h,r,fill,stroke='#29464a',lw=3){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();if(stroke){g.lineWidth=lw;g.strokeStyle=stroke;g.stroke()}}
function line(x,y,X,Y,color,w=3){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.stroke()}

function text(t,x,y,size,col='#fff4cb',align='left'){g.font='900 '+size+'px system-ui';g.fillStyle=col;g.textAlign=align;g.fillText(t,x,y)}
function city(cam,t){const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#77d9c7');sky.addColorStop(1,'#f9edb0');g.fillStyle=sky;g.fillRect(0,0,W,H);ellipse(W-190,100,65,65,'#fff2ad');for(let i=-1;i<7;i++){let x=i*240-(cam*.10)%240;ellipse(x,305+Math.sin(i)*45,245,160,'#82b9a1');ellipse(x+110,319,150,110,'#a6cfaa')}for(let i=-1;i<11;i++){let x=i*145-(cam*.25)%145,h=55+((i+21)*73%95);rr(x,360-h,118,h+80,4,['#88b4aa','#a0bc9c','#d1cc9a'][((i%3)+3)%3],null);for(let k=0;k<3;k++)rr(x+14+k*32,373-h,17,28,3,'#cbe3ba',null)}const colors=['#ebaa69','#73bdb0','#e18d78','#ead58e'];for(let i=-1;i<8;i++){let ix=Math.floor(cam*.60/205)+i,x=i*205-(cam*.60)%205,h=135+((ix+9999)*37%78),y=G-h-24;rr(x,y,196,h+25,5,colors[((ix%4)+4)%4],'#48675d',2);rr(x-4,y-10,204,18,4,'#fff1c1','#48675d',2);for(let k=0;k<3;k++){let bx=x+16+k*58;rr(bx,y+20,42,51,4,'#fff0bd','#527c71',2);rr(bx+7,y+27,28,37,3,'#456e68',null);line(bx+20,y+28,bx+20,y+64,'#bfdcca',2)}rr(x+60,G-91,76,67,7,'#518a80','#48675d');for(let k=0;k<5;k++)rr(x+51+k*19,G-103,19,19,4,k%2?'#fff0be':'#d46c57',null);rr(x+10,G-43,32,20,4,'#bc7350',null);for(let k=0;k<3;k++){line(x+5+k*64,y+10,x+5+k*64,G-25,'#ffecc099',2)}if(ix%2===0){ellipse(x+165,G-63,16,16,'#f7d88c','#7a725c');ellipse(x+165,G-63,6,6,'#8a7d60');for(let k=0;k<8;k++){let a=k*Math.PI/4;line(x+165+Math.cos(a)*12,G-63+Math.sin(a)*12,x+165+Math.cos(a)*19,G-63+Math.sin(a)*19,'#7a725c',3)}}text(['GEAR','POST','BAKE','TEA'][((ix%4)+4)%4],x+97,y+91,13,'#385b56','center');if(ix%3===0){line(x+173,G-22,x+173,G-114,'#526b5e',5);ellipse(x+173,G-118,13,13,'#fff2a0','#526b5e')}}g.fillStyle='#d49d61';g.fillRect(0,G-24,W,24);g.fillStyle='#f4cc7f';g.fillRect(0,G,W,H-G);line(0,G,W,G,'#8b624b',5);for(let i=-1;i<18;i++){let x=i*84-cam%84;line(x,G+20,x+36,G+75,'#e1b573',2);line(x,G+75,x+84,G+75,'#e1b573',2);if(i%3===0){ellipse(x+18,G+28,9,3,'#ca9d62');ellipse(x+26,G+31,4,2,'#ca9d62')}}for(let i=0;i<7;i++){let x=i*185-(cam*.15)%185;line(x,145,x+160,160,'#739b86',1);for(let k=0;k<5;k++){g.fillStyle=['#eb795f','#ffcf65','#ecf0bb'][k%3];g.beginPath();g.moveTo(x+k*30,145+k*3);g.lineTo(x+k*30+22,146+k*3);g.lineTo(x+k*30+11,162+k*3);g.fill()}}}
function critter(x,o,t){let y=G-24+Math.sin(t*7+o.phase)*3;ellipse(x,G-2,24,7,'#ae8755');let color=o.type==='spring'?'#68cdb0':o.type==='cargo'?'#eeb058':o.type==='cart'?'#a8aeb4':'#658cbe';rr(x-22,y-22,44,40,11,color);if(o.type==='cart'){rr(x-28,y-27,56,34,6,'#a8aeb4');line(x-20,y-20,x+20,y+3,'#e1e5d9',5);return}ellipse(x-10,y-8,6,7,'#f9edc2');ellipse(x+9,y-8,6,7,'#f9edc2');ellipse(x-8,y-7,2.5,3,'#253e46');ellipse(x+11,y-7,2.5,3,'#253e46');line(x-5,y+5,x+5,y+5,'#28434a',2);line(x-12,y+18,x-18+Math.sin(t*9)*5,G-1,'#29464a',7);line(x+12,y+18,x+18-Math.sin(t*9)*5,G-1,'#29464a',7);if(o.type==='spring'){line(x-10,y-26,x+10,y-29,'#29464a',4);line(x+10,y-29,x-9,y-34,'#29464a',4);line(x-9,y-34,x+10,y-40,'#29464a',4)}else if(o.type==='cargo'){rr(x-14,y-36,28,16,3,'#f8df9f');line(x,y-35,x,y-21,'#ac6c45',2)}else{line(x,y-22,x,y-31,'#29464a',3);ellipse(x,y-33,5,5,'#ffdc82','#29464a')}}
function courier(x,y,t){ellipse(x,G-2,32,8,'#ac8659');g.save();g.translate(x,y);let angle=s?.phase==='fly'?clamp((s.vy||0)/1100,-.45,.6):Math.sin(t*4)*.03;g.rotate(angle);g.fillStyle='#d46c57';g.beginPath();g.moveTo(-14,-10);g.lineTo(-66,-12+Math.sin(t*10)*9);g.lineTo(-48,17);g.lineTo(-10,11);g.fill();rr(-29,-17,52,49,13,'#d58a4e');rr(-32,-34,60,37,15,'#ffda89');rr(-29,-39,55,14,6,'#396d68');rr(-23,-22,45,18,7,'#f8e9bf');ellipse(-8,-13,5,6,'#263c41');ellipse(12,-13,5,6,'#263c41');line(-3,-1,9,-1,'#80533b',2);rr(18,-2,18,23,5,'#f7c466');rr(-38,-5,15,24,5,'#f7c466');rr(-20,22,22,14,5,'#355b59');rr(7,22,22,14,5,'#355b59');rr(-22,3,35,21,4,'#fff0ba');line(-21,11,12,11,'#b57548',3);g.restore()}
function render(now){const t=s?.active||now/1000,cam=s?.cam||0;g.save();city(cam,t);if(s){if(s.shake&&!settings.reduced)g.translate(Math.sin(t*95)*s.shake,Math.cos(t*83)*s.shake*.3);for(const o of s.objects){const x=o.x+Math.sin(t*2+o.phase)*20-cam;if(!o.used&&x>-80&&x<W+80)critter(x,o,t)}for(let gate=s.nextGate;gate<s.x+1400;gate+=2200){let x=gate-cam;if(x>0&&x<W){rr(x-15,G-180,30,180,5,'#396d68');rr(x-85,G-186,170,30,8,'#ffda85');text('DELIVERY',x,G-164,16,'#315951','center')}}for(const p of s.particles){g.globalAlpha=clamp(p.life*3,0,1);ellipse(p.x-cam,p.y,4,4,p.color)}g.globalAlpha=1;if(s.phase==='aim'){let x=s.x-cam;rr(x-55,G-20,110,20,7,'#a76b4c');for(let i=0;i<4;i++)line(x-40,G-24-i*9,x+33,G-29-i*9,'#3e6c69',6);let power=.5+.5*Math.sin(s.aim*3.3-Math.PI/2);rr(x-75,s.y-100,150,18,8,'#254c4a');rr(x-71,s.y-96,142*power,10,5,'#ffce66',null);text('TIME YOUR LAUNCH',x,s.y-111,13,'#254c4a','center')}if(s.phase==='fly'&&s.vx>550&&!settings.reduced){for(let i=0;i<5;i++){const x=s.x-cam-55-i*27,y=s.y-28+i*11;line(x,y,x-35-(s.vx-550)/12,y,'#ffefb1',3)}}courier(s.x-cam,s.y,t);if(s.noteTime>0){let nx=clamp(s.x-cam,160,W-160);text(s.notice,nx,Math.max(145,s.y-64),22,'#224d4a','center')}if(s.active>=240){rr(W/2-100,80,200,29,12,'#ac493f',null);text('FINAL PARADE',W/2,101,16,'#fff3c1','center')}}else{for(let i=0;i<8;i++)critter(80+i*140,{type:['bot','spring','cargo','bot'][i%4],phase:i},t);courier(170,390,t)}g.restore()}
function frame(now){let dt=(now-last)/1000;last=clockNow=now;advance(dt);hud();render(now);requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight','Escape','KeyA','KeyD'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.repeat)return;if(e.code==='Space'){if(mode==='title')start();else action()}if(e.code==='Escape')togglePause();if(e.code==='KeyM'){settings.mute=!settings.mute;save()}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();held.clear();if(mode==='run'&&s.lease>0)togglePause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='run'&&s.lease>0)togglePause()});$('pause').onclick=togglePause;$('action').onclick=action;for(const id of ['left','right']){$(id).onpointerdown=e=>{held.add(id);e.target.setPointerCapture(e.pointerId)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])$(id).addEventListener(ev,()=>held.delete(id))}c.addEventListener('pointerdown',()=>{if(mode==='run')action()});window.addEventListener('resize',resize);resize();refresh();requestAnimationFrame(frame);

window.springjackSnapshot=()=>s?{mode,active:s.active,lease:s.lease,wall:s.wall,phase:s.phase,x:s.x,y:s.y,score:s.score,coins:s.coins,tier:s.tier,branch:s.branch,stamps:s.stamps,best:s.best,objects:s.objects.length,particles:s.particles.length,finalScore:s.finalScore}: {mode};
